CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_PICOLIBC=y

# Shell over USB serial (disabled during debug)
# CONFIG_SHELL=y
# CONFIG_SHELL_BACKEND_SERIAL=y

# Logging — console is USB CDC ACM (build with -S cdc-acm-console).
# Deferred mode buffers log lines so a slow or absent host doesn't drop them.
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_PROCESS_THREAD=y
CONFIG_LOG_PRINTK=n
CONFIG_LOG_BACKEND_UART=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# WiFi (Infineon CYW43439 / Murata 1YN on Pico W / Pico 2 W)
CONFIG_WIFI=y
CONFIG_WIFI_AIROC=y
CONFIG_CYW43439_MURATA_1YN=y
CONFIG_NET_L2_WIFI_MGMT=y

# Networking
CONFIG_NETWORKING=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_IPV4=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONFIG_SETTINGS=y
CONFIG_DNS_RESOLVER=y
CONFIG_SNTP=y
CONFIG_TEST_RANDOM_GENERATOR=y

# Console input for WiFi setup — uses uart_poll_in() directly

CONFIG_THREAD_CUSTOM_DATA=y

# Stack sizes — defaults are too small for WiFi + networking + shell
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# main() waits up to CONSOLE_WAIT_MS for a host to open the USB console

# Debug — fault diagnostics
CONFIG_THREAD_NAME=y
CONFIG_FAULT_DUMP=2

# NVS storage
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
