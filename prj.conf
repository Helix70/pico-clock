CONFIG_GPIO=y
CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_NEWLIB_LIBC=y

# Shell over USB serial (disabled during debug)
# CONFIG_SHELL=y
# CONFIG_SHELL_BACKEND_SERIAL=y

# Logging — route to UART0 (physical serial), not USB CDC
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y

# WiFi (Infineon CYW43439 / Murata 1YN on Pico 2 W)
# Disabled temporarily — whd_wifi_on() hangs reading FEEDBEAD,
# blocking main() and all PIO/LED init.
# CONFIG_WIFI=y
# CONFIG_WIFI_AIROC=y
# CONFIG_CYW43439_MURATA_1YN=y
# CONFIG_NET_L2_WIFI_MGMT=y

# Networking — disabled while WiFi is off
# CONFIG_NETWORKING=y
# CONFIG_NET_SOCKETS=y
# CONFIG_NET_IPV4=y
# CONFIG_NET_UDP=y
# CONFIG_NET_TCP=y
# CONFIG_NET_DHCPV4=y
# CONFIG_NET_DHCPV4_SERVER=y
# CONFIG_NET_CONFIG_SETTINGS=y
# CONFIG_NET_CONFIG_MY_IPV4_ADDR="192.168.4.1"
# CONFIG_NET_CONFIG_MY_IPV4_NETMASK="255.255.255.0"
# CONFIG_DNS_RESOLVER=y
# CONFIG_SNTP=y

CONFIG_THREAD_CUSTOM_DATA=y

# Stack sizes — defaults are too small for WiFi + networking + shell
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# No boot delay needed — console is on UART0, not USB CDC

# Debug — fault diagnostics
CONFIG_THREAD_NAME=y
CONFIG_FAULT_DUMP=2

# NVS storage
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NVS=y
